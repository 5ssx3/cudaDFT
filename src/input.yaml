# 1. 系统体系
system:
  molecule_file: target/molecule.json
  density_file: target/density_total.npy
  spin: unpolarized

# 2. 计算盒设置
domain:
  padding: [12.0, 12.0, 12.0]
  orbital_boundary: dirichlet_zero

# 3. 网格设置
mesh:
  type: uniform
  finite_half_width: 4
  rgrids: 80 80 80

# 4. 反解设置
inversion:
  initial_potential: zero
  regularization_eta: 1e-8
  extra_states: 4

  eigensolver:
    method: davidson
    residual_tolerance: 1.0e-9
    max_subspace_dim: 32
    max_iterations: 100
    nextra_retain: 3
    direction_tolerance: 1.0e-8

  occupations:
    method: fixed
    temperature : 0

  optimizer:
    method: lbfgs
    history: 10
    max_iterations: 1000
    max_linesearch_step: 50
    c1: 1.0e-4
    c2: 0.9

  convergence:
    gradient_tolerance: 5.0e-6

# 5. 输出设置
output:
  directory: ./results
  write_veff: true
  write_density: true
  write_density_difference: true
  write_eigenvalues: true
  write_wave: true
